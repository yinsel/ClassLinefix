name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Smoke test executable JAR
        run: java -jar target/ClassLinefix-*.jar --help
      - name: Verify real JVM breakpoints, locals, and line stepping
        if: matrix.java == '17'
        run: java --add-modules jdk.jdi -cp target/ClassLinefix-*.jar src/test/debugger/DebuggerSmokeTest.java
      - name: Verify automatic Fernflower mapping and real JVM line debugging
        if: matrix.java == '17'
        run: |
          curl --fail --location --retry 3 --output target/fernflower-test.jar https://www.jetbrains.com/intellij-repository/releases/com/jetbrains/intellij/java/java-decompiler-engine/241.19416.15/java-decompiler-engine-241.19416.15.jar
          echo 'e027383792fc5030c05e3c4a7c5729cdad6e2718f7a0961f7e515bb76343c493  target/fernflower-test.jar' | sha256sum --check
          java --add-modules jdk.jdi -cp 'target/*' src/test/debugger/FernflowerDebuggerSmokeTest.java
