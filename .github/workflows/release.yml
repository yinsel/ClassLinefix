name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z, for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag and branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/master" && "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo '::error::Run this workflow from master or main.'
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Tag must use vX.Y.Z format, for example v1.1.0.'
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse an existing tag or release
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo '::error::This tag already exists. Choose a new version.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::This release already exists. Choose a new version.'
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Set build version
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify JAR and create checksum
        run: |
          java -jar "target/ClassLinefix-$RELEASE_VERSION.jar" --help
          cd target
          sha256sum "ClassLinefix-$RELEASE_VERSION.jar" > "ClassLinefix-$RELEASE_VERSION.jar.sha256"
      - name: Tag the tested commit, create draft with assets, then publish
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "target/ClassLinefix-$RELEASE_VERSION.jar" \
            "target/ClassLinefix-$RELEASE_VERSION.jar.sha256" \
            --verify-tag --title "ClassLinefix $RELEASE_TAG" \
            --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
